name: Deploy to GitHub Pages

on:
  push:
    branches: ["master", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Validation is a separate job so a pull request gets the same checks without
  # deploying, and so a failing bank can never reach the published site.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check courses.js
          node --check catalog.js
          node --check exam.js
          node --check app.js
          node --check tools/audit.js
          node --check tools/build.js
          node --check tools/artifact-test.js
          for f in data/*.js; do node --check "$f"; done

      - name: Audit question banks
        run: node tools/audit.js

      - name: Engine and persistence tests
        run: node tools/test.js

      - name: End-to-end tests
        run: node tools/e2e.js

      - name: Public artifact leakage test
        run: node tools/artifact-test.js

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Publish only the runtime files. Deploying the repository root would also
      # expose the generator scripts and audit tooling through the site.
      - name: Stage runtime assets
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
